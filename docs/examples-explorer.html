<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧭 Examples explorer · kafka-docker-playground</title>
<script>
(function () {
  var root = document.documentElement, saved = null;
  try { saved = localStorage.getItem("pg-report-theme"); } catch (e) {}
  root.dataset.theme = saved === "dark" || saved === "light" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  // embedded in the Examples page of the docs (always dark): same theme, no theme switch
  if (window.parent !== window) { root.dataset.theme = "dark"; root.classList.add("embedded"); }
})();
</script>
<style>
/* the look of the pipeline builder and of the examples explorer: inlined in both pages by catalog.py. The palette of the
   website and of the HTML reports (docs/assets/css/main.css, tools/report-common/report_html.py): teal -> amber accents,
   the ink #0e1418 with #141c21 cards in the dark theme */
:root{
  --bg:#f4f6fb;--bg2:#e9edf7;--card:#ffffff;--card2:#f8faff;--fg:#0f172a;--muted:#5b6478;--line:#e3e8f2;
  --a1:#0891b2;--a2:#d97706;--a3:#f59e0b;--glow:rgba(8,145,178,.16);
  --ok:#059669;--warn:#d97706;--fix:#0e7490;--info:#0284c7;
  --warn-bg:#fff7e6;--fix-bg:#e6f6fa;--info-bg:#e9f6fd;--ok-bg:#e8f8f1;
  --term:#0b1020;--term-fg:#e2e8f0;--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
}
html[data-theme="dark"]{
  --bg:#0e1418;--bg2:#10191e;--card:#141c21;--card2:#19242a;--fg:#dbe5ea;--muted:#8a9ba6;--line:#26343d;
  --a1:#22b8d6;--glow:rgba(139,216,239,.16);--warn-bg:#2a1f0b;--fix-bg:#0f2a33;--info-bg:#0b2233;--ok-bg:#0b2a20;
  --term:#0a0f12;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter Variable",Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--fg);line-height:1.45;
  background:radial-gradient(1200px 500px at 10% -10%,var(--glow),transparent 60%),radial-gradient(900px 400px at 100% 0%,rgba(255,196,92,.07),transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
code,pre,.mono{font-family:"JetBrains Mono Variable",'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace}

/* hero */
/* the banner: a card like the header of the HTML reports of playground (report_html.banner_css, injected by catalog.py,
   gives the same gradient; this one is the fallback) */
header{margin-top:22px;border-radius:18px;padding:22px 30px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(1200px 300px at 0% 0%,rgba(139,216,239,.30),transparent 60%),radial-gradient(800px 260px at 100% 100%,rgba(255,196,92,.28),transparent 60%),
  linear-gradient(120deg,#0b1115 0%,#10212b 50%,#173540 100%);box-shadow:0 10px 30px rgba(8,47,73,.35);border:1px solid rgba(215,239,246,.12)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;position:relative;z-index:1}
.brand{min-width:0}
h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.tag{opacity:.82;font-size:.86rem;font-weight:500;margin-top:6px}
.tag code{background:rgba(255,255,255,.18);padding:1px 6px;border-radius:6px;font-size:.82rem}
.tools{display:flex;align-items:center;gap:10px}
.theme{border:0;cursor:pointer;width:40px;height:40px;border-radius:50%;font-size:18px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:.2s}
.theme:hover{background:rgba(255,255,255,.28)}
.seg{display:inline-flex;background:rgba(255,255,255,.16);border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-weight:600;font-size:.9rem;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--a1);box-shadow:0 4px 14px rgba(0,0,0,.18)}

main{padding:20px 0 40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.full{grid-column:1/-1}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 18px 16px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.head h2{margin:0;font-size:1.02rem;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 4px 10px var(--glow)}
.hint{color:var(--muted);font-size:.8rem}

/* search + lists */
.search{position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--card2);color:var(--fg);font:inherit;font-size:.9rem;outline:none;transition:.15s}
.search input:focus{border-color:var(--a1);box-shadow:0 0 0 4px var(--glow)}
.search::before{content:"🔎";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.7}
.list{max-height:360px;overflow:auto;margin:10px -6px 0;padding:6px 10px 8px 6px;display:flex;flex-direction:column;gap:6px;scrollbar-gutter:stable}
.item{display:flex;gap:12px;align-items:center;padding:9px 11px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.12s;background:transparent}
.item:hover{background:var(--card2);border-color:var(--line)}
.item.selected{background:linear-gradient(var(--card2),var(--card2)) padding-box,linear-gradient(120deg,var(--a1),var(--a3)) border-box;border:1px solid transparent;box-shadow:0 3px 10px var(--glow)}
.ico{width:34px;height:34px;flex:none;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(15,23,42,.08)}
.ico img{max-width:24px;max-height:24px}
.ico.fallback{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:16px}
.txt{min-width:0;flex:1}
.t{font-weight:650;font-size:.9rem;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:0}
.t>.name{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.t .name{overflow:hidden;text-overflow:ellipsis}
.d{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.variant{display:inline-block;flex:0 1 auto;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;padding:1px 8px;border-radius:999px;font-family:'JetBrains Mono','SFMono-Regular',Consolas,Menlo,monospace;
  font-size:.72rem;font-weight:700;vertical-align:1px;color:var(--a1);background:var(--glow);border:1px solid rgba(8,145,178,.35);white-space:nowrap}
.variant.default{color:var(--muted);background:transparent;border-color:var(--line);font-weight:600}
html[data-theme="dark"] .variant{color:#8bd8ef}
.node .variant{margin-top:3px;max-width:100%}
.tick{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff;transition:.12s}
.item.selected .tick{border:0;background:linear-gradient(135deg,var(--a1),var(--a3));background-origin:border-box}
.item.selected .tick::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.count{color:var(--muted);font-size:.78rem;margin-top:8px}
.empty{color:var(--muted);font-size:.85rem;padding:18px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none}
.switch input{display:none}
.switch i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+i{background:linear-gradient(120deg,var(--a1),var(--a2))}
.switch input:checked+i::after{left:16px}

/* flow */
.flow{display:flex;align-items:center;justify-content:safe center;gap:0;overflow-x:auto;padding:26px 8px;min-height:170px;
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/18px 18px;border-radius:14px;border:1px dashed var(--line)}
.node{flex:none;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:214px;box-shadow:var(--shadow)}
.node b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .txt>span:not(.variant){display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node a{font-size:.72rem;color:var(--a1);text-decoration:none}
.node.ghost{border-style:dashed;color:var(--muted);box-shadow:none;justify-content:center;font-size:.85rem}
.topic{flex:none;display:flex;flex-direction:column;align-items:center;padding:12px 20px;border-radius:999px;color:#fff;font-weight:650;font-size:.86rem;max-width:240px;
  background:linear-gradient(120deg,var(--a1),var(--a3));box-shadow:0 8px 24px var(--glow)}
.topic small{font-weight:500;opacity:.85;font-size:.7rem}
.topic b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.step{flex:none;white-space:nowrap;display:flex;flex-direction:column;align-items:center;padding:12px 18px;border-radius:14px;color:#fff;font-weight:650;font-size:.86rem;
  background:linear-gradient(135deg,#0e7490,var(--a2));box-shadow:0 8px 24px rgba(8,145,178,.3)}
.step small{font-weight:500;opacity:.85;font-size:.7rem}
.step small.to{max-width:190px;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pipe{flex:none;width:44px;height:3px;border-radius:3px;position:relative;margin:0 6px;
  background:repeating-linear-gradient(90deg,var(--a1) 0 8px,transparent 8px 14px);background-size:28px 3px;animation:flowing 1s linear infinite;opacity:.8}
.pipe::after{content:"";position:absolute;right:-2px;top:-4px;border:5.5px solid transparent;border-left:8px solid var(--a1)}
@keyframes flowing{to{background-position:28px 0}}
.sinks{flex:none;display:flex;flex-direction:column;gap:10px}
@media (prefers-reduced-motion:reduce){.pipe{animation:none}}

.settings{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.9fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;margin-top:16px}
@media (max-width:980px){.settings{grid-template-columns:repeat(2,minmax(0,1fr))}}
.set{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.set label,.set .lbl{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.set select,.set input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:.84rem;outline:none}
.set select:focus,.set input:focus{border-color:var(--a1)}
.set .val{font-size:.84rem}
.set select{appearance:none;-webkit-appearance:none;padding-right:30px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;cursor:pointer;font:inherit;color:var(--fg);
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;transition:.15s;min-width:0}
.choice b{font-size:.8rem;white-space:nowrap}
.choice small{color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.choice:hover:not(:disabled){border-color:var(--a1)}
.choice[aria-checked=true]{background:linear-gradient(var(--card2),var(--card2)) padding-box,linear-gradient(120deg,var(--a1),var(--a2)) border-box;border:1px solid transparent;box-shadow:0 4px 14px var(--glow)}
.choice[aria-checked=true] small{color:var(--fg);opacity:.8}
.choice:disabled{opacity:.45;cursor:not-allowed}
.set input{margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.74rem}
code{background:var(--card2);border:1px solid var(--line);padding:0 5px;border-radius:5px;font-size:.78rem}

/* checks */
.findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.findings li{display:flex;gap:10px;padding:10px 12px;border-radius:12px;font-size:.85rem;border:1px solid var(--line);border-left-width:4px}
.findings li .ic{font-size:1rem;line-height:1.3}
.sev-fix{background:var(--fix-bg);border-left-color:var(--fix)!important}
.sev-warn{background:var(--warn-bg);border-left-color:var(--warn)!important}
.sev-info{background:var(--info-bg);border-left-color:var(--info)!important}
.sev-ok{background:var(--ok-bg);border-left-color:var(--ok)!important}
.findings b{font-weight:650}
.adds{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}

/* command */
.desc{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.desc label{font-size:.8rem;color:var(--muted);white-space:nowrap}
.desc input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);font:inherit;font-size:.88rem;outline:none}
.desc input:focus{border-color:var(--a1);box-shadow:0 0 0 4px var(--glow)}
.term{background:var(--term);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06)}
.term .bar{display:flex;align-items:center;gap:7px;padding:9px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06)}
.term .bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term .bar span{margin-left:auto;color:#7a869e;font-size:.72rem}
.term pre{margin:0;padding:14px 16px;color:var(--term-fg);font-size:.8rem;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.k{color:#67e8f9}.f{color:#f0abfc}.s{color:#86efac}.c{color:#7a869e}
.btn{border:0;cursor:pointer;font:inherit;font-weight:650;font-size:.85rem;color:#fff;padding:9px 16px;border-radius:10px;background:linear-gradient(120deg,var(--a1),var(--a2));box-shadow:0 6px 18px var(--glow);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.note{color:var(--muted);font-size:.8rem;margin:10px 2px 0}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding:10px 0 30px}
footer a{color:var(--a1);text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* the explorer */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:16px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fchip{border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;transition:.12s;white-space:nowrap}
.fchip small{color:var(--muted);font-weight:500;margin-left:4px}
.fchip:hover{border-color:var(--a1)}
.cif{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.cib{border:1px solid var(--line);background:var(--card2);color:var(--fg);font:inherit;font-size:.74rem;font-weight:600;padding:4px 9px;border-radius:999px;cursor:pointer;transition:.12s;white-space:nowrap}
.cib small{color:var(--muted);font-weight:500;margin-left:4px}
.cib:hover{border-color:var(--a1)}
.cib[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--a1),var(--a2))}
.cib.ok[aria-pressed=true]{background:linear-gradient(120deg,#059669,#10b981)}
.cib.fail[aria-pressed=true]{background:linear-gradient(120deg,#dc2626,#f97316)}
.cib.none[aria-pressed=true]{background:linear-gradient(120deg,#64748b,#94a3b8)}
.cib[aria-pressed=true] small{color:rgba(255,255,255,.85)}
.flabel{align-self:center;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px;cursor:help}
.tchip{border-style:dashed;background:transparent}
.tchip[aria-pressed=true]{border-style:solid}
.fchip[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--a1),var(--a2));box-shadow:0 4px 12px var(--glow)}
.fchip[aria-pressed=true] small{color:rgba(255,255,255,.8)}
.achip{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:.8rem;font-weight:650;padding:7px 12px;border-radius:12px;cursor:pointer;transition:.12s;white-space:nowrap}
.achip small{color:var(--muted);font-weight:500;margin-left:4px}
.achip:hover{border-color:var(--a1)}
.achip[aria-pressed=true]{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--a2),var(--a3));box-shadow:0 4px 12px var(--glow)}
.achip[aria-pressed=true] small{color:rgba(255,255,255,.85)}
#areas{padding-bottom:10px;border-bottom:1px dashed var(--line)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
#list{max-height:none;height:calc(100vh - 360px);min-height:420px}
/* embedded in the Examples page of the docs: part of the page, not a page in a frame. No banner, footer or background
   (the docs page has its title and its links), the cards on the colour of the docs, the list grows with the page (one
   scroll bar, the page's) and the detail follows the scroll of the page (the docs page sends it: position sticky
   cannot see the scroll of the parent page) */
html.embedded body{min-height:0;background:transparent}
html.embedded header,html.embedded footer{display:none}
html.embedded .wrap{max-width:none;padding:0 2px}
html.embedded main{padding:2px 0 12px}
html.embedded{color-scheme:dark;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--shadow:none}
html.embedded .dd-panel{background:#1c2130}
html.embedded #list{height:auto;min-height:0;max-height:none;overflow:visible;margin:10px 0 0;padding:0}
html.embedded .sticky{position:relative;top:0;transition:transform .12s ease-out}
html.embedded .toast{position:absolute;bottom:auto}
.more-list{display:block;margin:8px auto 0}
.ci{width:10px;height:10px;border-radius:50%;flex:none}
.ci.ok{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.ci.fail{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.armk{font-size:.85rem;flex:none;cursor:help}
.enote{color:var(--muted);font-size:.8rem;margin-top:4px}
.more{color:var(--muted);font-size:.8rem;text-align:center;padding:10px}
/* detail */
.hero{display:flex;gap:16px;align-items:center}
.hero .ico{width:56px;height:56px;border-radius:14px}
.hero .ico img{max-width:40px;max-height:40px}
.hero .ico.fallback{font-size:28px}
.hero h2{margin:0;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.hero .variant{font-size:.8rem}
.path{color:var(--muted);font-size:.8rem;margin-top:3px;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tagc{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.tagc.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.tagc.fail{background:#fde8e8;border-color:transparent;color:#dc2626}
html[data-theme="dark"] .tagc.fail{background:#3a1212;color:#fca5a5}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.lbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-size:.82rem;font-weight:600;text-decoration:none;color:var(--fg);background:var(--card2);border:1px solid var(--line);transition:.12s}
.lbtn:hover{border-color:var(--a1);transform:translateY(-1px)}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}

// embedded in the Examples page of the docs: the frame takes the height of the page (sent to the docs page), so the
// list grows with the page (LIST_PAGE examples at a time, a button shows more) instead of a height based on the window
// (that would grow the frame in a loop). The docs page sends where the frame is in its window (kdp-viewport: top of
// the frame, height of the window): the detail stays in view while the page scrolls, and so does the toast
const EMBEDDED = window.parent !== window;
const LIST_PAGE = 40;
let listLimit = EMBEDDED ? LIST_PAGE : 300;
let viewport = null;
function followViewport() {
  if (!EMBEDDED || !viewport) return;
  const detail = $("detail"), layout = detail.parentNode;
  // one column (narrow window): the detail is under the list, it does not move
  const side = detail.offsetTop === layout.offsetTop;
  const room = layout.offsetHeight - detail.offsetHeight;
  const shift = side && room > 0 ? Math.max(0, Math.min(room, 16 - viewport.top - layout.offsetTop)) : 0;
  detail.style.transform = shift ? `translateY(${shift}px)` : "";
  const toast = $("toast");
  toast.style.top = Math.max(0, Math.min(document.documentElement.scrollHeight - 60, viewport.height - viewport.top - 70)) + "px";

    if (!names.includes(lcp)) lcp = lcp.slice(0, Math.max(...["-", "_", "."].map(c => lcp.lastIndexOf(c))) + 1);

// ---------------------------------------------------------------- README preview
const RAW = "https://raw.githubusercontent.com/vdesabou/kafka-docker-playground/master/";
const readmes = {};          // dir -> markdown, or "loading" / "failed"
let readmeOpen = false;      // the whole README shown, or the preview
let readmeScroll = {dir: null, top: 0};   // the scroll of the preview, kept when the detail is drawn again
function readmeBlock(e) {
  const r = readmes[e.dir];
  if (r === undefined) {
    readmes[e.dir] = "loading";
    fetch(RAW + e.dir + "/README.md").then(x => x.ok ? x.text() : Promise.reject())
      .then(t => { readmes[e.dir] = t; }).catch(() => { readmes[e.dir] = "failed"; })
      .then(() => { if (state.sel && byPath(state.sel).dir === e.dir) renderDetail(); });
    return `<div class="readme-msg">loading the README…</div>`;
  }

  if (r === "failed") return `<div class="readme-msg">the README could not be loaded (offline?): <a href="${GITHUB + esc(e.dir)}" target="_blank" rel="noopener">read it on GitHub ↗</a></div>`;
  return `<div class="readme${readmeOpen ? " open" : ""}"><div class="md">${md(r, e.dir)}</div></div>
    <button type="button" class="mini more-btn" data-readme="1">${readmeOpen ? "▲ Back to the scrolling preview" : "▼ Unfold the whole README"}</button>`;

// a small Markdown renderer for the READMEs: everything is escaped first (no HTML from the file), then headings,
// paragraphs, lists, tables, code blocks, quotes, images, links, inline code, bold and italic
function mdUrl(url, dir, image) {
  url = url.trim().split(/\s+/)[0];
  if (/^https?:\/\//i.test(url)) return url;
  if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return "";          // javascript:, data:…
  if (url.startsWith("#")) return GITHUB + dir + url;
  const parts = (dir + "/" + url.replace(/^\.\//, "")).split("/");
  const out = [];
  for (const p of parts) { if (p === "..") out.pop(); else if (p && p !== ".") out.push(p); }
  return (image ? RAW : GITHUB.replace("/tree/", "/blob/")) + out.join("/");
}
function mdInline(text, dir) {
  const codes = [];
  let t = esc(text).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, u) => { const url = mdUrl(u.replace(/&amp;/g, "&"), dir, true); return url ? `<img src="${esc(url)}" alt="${alt}" loading="lazy">` : ""; });
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, u) => { const url = mdUrl(u.replace(/&amp;/g, "&"), dir, false); return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : label; });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])_([^_]+)_(?=[\s.,;:)!?]|$)/g, "$1<i>$2</i>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s.,;:)!?]|$)/g, "$1<i>$2</i>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[+n]}</code>`);
}
function md(src, dir) {
  const lines = src.replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${mdInline(para.join(" "), dir)}</p>`); para = []; } };
  const isList = l => /^\s*([-*+]|\d+\.)\s+/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush();
      const code = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      out.push(`<pre class="mdcode"><code>${esc(code.join("\n"))}</code></pre>`);
      i++; continue;
    }
    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if (h) { flush(); const n = Math.min(h[1].length + 2, 6); out.push(`<h${n}>${mdInline(h[2], dir)}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="mdtable"><table><thead><tr>${head.map(c => `<th>${mdInline(c, dir)}</th>`).join("")}</tr></thead><tbody>${rows.map(r =>
        `<tr>${r.map(c => `<td>${mdInline(c, dir)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)) {
      flush();
      const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, "").replace(/^\[!(\w+)\]$/, "<b>$1</b>"));
      out.push(`<blockquote>${mdInline(q.join(" "), dir).replace(/&lt;b&gt;(\w+)&lt;\/b&gt;/, "<b>$1</b>")}</blockquote>`);
      continue;
    }
    if (isList(l)) {
      flush();
      // nested by indentation: a stack of open lists
      const stack = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && stack.length))) {
        const line = lines[i];
        const m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if (!m) { out.push(" " + mdInline(line.trim(), dir)); i++; continue; }
        const indent = m[1].length, tag = /\d/.test(m[2]) ? "ol" : "ul";
        while (stack.length && indent < stack[stack.length - 1].indent) out.push(`</li></${stack.pop().tag}>`);
        if (!stack.length || indent > stack[stack.length - 1].indent) { out.push(`<${tag}>`); stack.push({indent, tag}); }
        else out.push("</li>");
        out.push(`<li>${mdInline(m[3], dir)}`);
        i++;
      }
      while (stack.length) out.push(`</li></${stack.pop().tag}>`);
      continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l.trim());
    i++;
  }
  flush();
  return out.join("\n");
}

function renderDetail() {
  const e = state.sel ? byPath(state.sel) : null;
  const keepScroll = e && readmeScroll.dir === e.dir ? readmeScroll.top : 0;
  requestAnimationFrame(() => { const r = document.querySelector("#detail .readme"); if (r && keepScroll) r.scrollTop = keepScroll; });
  if (!e) {
    $("detail").innerHTML = `<div class="empty-detail"><div class="big">🧭</div><h2>Pick an example</h2>
      <div>Search by connector, database, cloud, security mechanism…<br>then choose its options and copy the <code>playground run</code> command.</div>
      <div class="links" style="justify-content:center;margin-top:20px"><a class="lbtn" href="pipeline-builder.html">🔗 Chain a source and sinks</a>
      <a class="lbtn" href="${DOCS}how-to-use" target="_blank" rel="noopener">🚀 Install the playground</a></div></div>`;
    return;
  }
  const cat = CAT[e.category] || CAT[""];
  const ci = CI && CI[e.dir];
  // each credential links to how to set it up: Confluent Cloud (confluent login, playground account ccloud setup), the others
  // stored with playground secrets (AWS, Azure, GCP, variables to export)
  const CRED_LABEL = {aws: "🔑 AWS credentials", azure: "🔑 Azure login", gcp: "🔑 GCP keyfile", ccloud: "☁️ Confluent Cloud"};
  const SETUP = {ccloud: [DOCS + "how-to-use?id=🌤️-confluent-cloud-examples", "how to set up the Confluent Cloud examples: confluent login, playground account ccloud setup"],
                 other: [DOCS + "how-to-use?id=🔐-storing-credentials-with-playground-secrets", "how to provide it: playground secrets, or an exported variable"]};
  const creds = [...(e.credentials || []).map(c => [CRED_LABEL[c] || "🔑 " + c, SETUP[c === "ccloud" ? "ccloud" : "other"]]),
                 ...(e.required_env || []).map(v => ["🔑 $" + v, SETUP.other])];
  if ((e.managed || e.category === "ccloud") && !(e.credentials || []).includes("ccloud")) creds.unshift([CRED_LABEL.ccloud, SETUP.ccloud]);
  let html = `<div class="hero">${icon(e)}<div style="min-width:0"><h2>${esc(title(e))}${variant(e)}</h2><div class="path mono">${esc(e.path)}</div>${e.note ? `<div class="enote">${esc(e.note)}</div>` : ""}</div></div>
    <div class="tags">${e.area ? (a => `<a class="tagc" href="${DOCS + a[2]}" target="_blank" rel="noopener" title="the area page: questions, commands, deep dives">${esc(a[1])} ↗</a>`)(AREAS.find(x => x[0] === e.area)) : ""}<span class="tagc">${cat[2]} ${esc(cat[1])}</span>
      ${e.topics.map(t => `<span class="tagc">${esc((TOPICS.find(x => x[0] === t) || [t, t])[1])}</span>`).join("")}
      ${e.connector ? `<span class="tagc mono">${esc(short(e.connector.class))}</span>` : ""}
      ${ci && ci.state ? `<a class="tagc ${ci.state}" href="${esc(ci.url)}" target="_blank" rel="noopener" title="last nightly CI run">${ci.state === "ok" ? "✅" : "🔥"} CI ${esc(ci.label)}</a>`
        : CI ? `<span class="tagc" title="this example is not in the matrix of the nightly CI: it may need manual steps or an account the CI does not have">⚪ not tested in CI</span>` : ""}
      ${ci && ci.cfk ? `<a class="tagc ${ci.cfk.state}" href="${esc(ci.cfk.url)}" target="_blank" rel="noopener" title="last nightly CI run with --environment cfk">☸️ CFK ${esc(ci.cfk.label)}</a>` : ""}
      ${ci && ci.arm64 && ARM[ci.arm64] ? `<span class="tagc ${ARM[ci.arm64][2]}" title="${esc(ARM[ci.arm64][1])}">${ARM[ci.arm64][0]} arm64 ${ci.arm64 === "native" ? "native" : ci.arm64 === "emulation" ? "emulation" : "not working"}</span>` : ""}
      ${ci && ci.version ? `<a class="tagc" href="${esc(ci.docs || e.docs_url || "#")}" target="_blank" rel="noopener" title="the connector version the CI ran, and its release date">🔢 v${esc(ci.version)}${ci.released ? " · " + esc(ci.released) : ""} ↗</a>` : ""}
      ${ci && ci.owner ? `<span class="tagc" title="the vendor of the connector">🏢 ${esc(ci.owner)}</span>` : ""}
      ${creds.map(([label, [href, title]]) => `<a class="tagc" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(title)}">${esc(label)} ↗</a>`).join("")}
      ${!creds.length ? `<span class="tagc ok">🆓 no credentials needed</span>` : ""}</div>
    <div class="links"><a class="lbtn" href="${GITHUB + esc(e.dir)}" target="_blank" rel="noopener">📖 README ↗</a>
      ${e.docs_url ? `<a class="lbtn" href="${esc(e.docs_url)}" target="_blank" rel="noopener">📘 Confluent docs ↗</a>` : ""}
      ${DEEP[e.category] ? `<a class="lbtn" href="${DOCS + DEEP[e.category]}" target="_blank" rel="noopener">🍪 Deep dive ↗</a>` : ""}
      <a class="lbtn" href="${GITHUB.replace("/tree/", "/blob/") + esc(e.path)}" target="_blank" rel="noopener">📜 Script ↗</a></div>`;

  // the sections below are tabs (Run it first): each one is drawn, the others hidden, so the README keeps its scroll
  const head = html.length, pane = {};
  // the README of the folder, fetched from GitHub when the example is picked (cached), as a preview that unfolds
  pane.readme = html.length;
  html += `<div class="sec"><h3>📖 README <a class="hlink" href="${GITHUB + esc(e.dir)}#readme" target="_blank" rel="noopener">open on GitHub ↗</a></h3>${readmeBlock(e)}</div>`;

  // run builder
  pane.run = html.length;
  const sm = !e.managed && e.category !== "ccloud" && e.category !== "custom-connector";
  const envOk = e.connector_example && e.honors_environment;
  html += `<div class="sec"><h3>▶️ Run it</h3><div class="opts">
    <div class="opt"><label for="o-env">🔐 Environment</label>${envOk
      ? envDropdown()
      : `<div class="off">${e.connector_example ? "set by the example" : e.managed ? "Confluent Cloud" : "set by the example (" + esc(e.environment || "its own") + ")"}</div>`}</div>
    <div class="opt"><label for="o-tag">🎯 CP version</label>${sm ? cpSelect() : `<div class="off">Confluent Cloud</div>`}</div>
    <div class="opt"><label for="o-ctag">🔌 Connector version</label>${e.connector_example ? connectorSelect(e) : `<div class="off">no connector plugin</div>`}</div>
  </div>`;
  // the options that apply: --enable-sql-datagen needs a load script inserting rows (the JDBC, Debezium, Oracle CDC and
  // XStream sources, fully managed too), the others start local components (self-managed only)
  const applies = f => f.flag === "--enable-sql-datagen" ? e.sql_datagen : sm;
  // the command right under the dropdowns, the option cards below it (it changes as they are toggled)
  const parts = [`playground run -f ${q(e.path)}`];
  if (envOk && state.env && state.env !== "plaintext") parts.push(`--environment ${state.env}`);
  if (sm && state.tag) parts.push(`--tag ${state.tag}`);
  if (e.connector_example && state.ctag) parts.push(`--connector-tag ${state.ctag}`);
  for (const f of RUN.enable) if (applies(f) && state.enable.includes(f.flag)) parts.push(f.flag);
  const run = join(parts);
  html += `<div class="term" style="margin-top:12px"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>run</span></div><pre>${highlight(run)}</pre></div>
    <div class="cmdrow"><button class="btn" data-copy="${esc(run)}">📋 Copy</button></div>`;
  const flags = RUN.enable.filter(applies);
  if (flags.length) {
    const byGroup = {};
    for (const f of flags) {
      const info = FLAG_INFO[f.flag] || ["⚙️", f.help.replace(/^[^\p{L}]+/u, "").replace(/^Enable /, "").replace(/\s*\(.*$/, ""), f.flag, "Components"];
      (byGroup[info[3]] = byGroup[info[3]] || []).push([f, info]);
    }
    html += FLAG_GROUPS.filter(g => byGroup[g[0]]).map(g => `<div class="fgroup"><div class="fgroup-t">${g[1]}</div><div class="flags">${byGroup[g[0]].map(([f, info]) =>
      `<button type="button" class="flag" data-flag="${esc(f.flag)}" aria-pressed="${state.enable.includes(f.flag)}" title="${esc(f.flag)}: ${esc(f.help)}">
        <span class="fi">${info[0]}</span><span class="ft"><b>${esc(info[1])}</b><small>${esc(info[2])}</small></span><span class="sw"></span></button>`).join("")}</div></div>`).join("");
  }
  html += `</div>`;


  // reproduction model
  pane.repro = html.length;
  const repro = join([`playground repro bootstrap -f ${q(e.path)}`, `-d "${state.desc.replace(/"/g, '\\"')}"`, "--no-run"]);
  html += `<div class="sec"><h3>🧪 Turn it into a reproduction model</h3>
    <div class="desc"><label for="o-desc">💡 Description</label><input type="text" id="o-desc" value="${esc(state.desc)}" placeholder="case number + a few words"></div>
    <div class="term"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>repro</span></div><pre>${highlight(repro)}</pre></div>
    <div class="cmdrow"><button class="btn" data-copy="${esc(repro)}">📋 Copy</button></div></div>`;

  pane.chain = html.length;
  if (e.pipeline) {
    const p = new URLSearchParams();
    if (e.managed) p.set("managed", "1");
    if (e.kind === "source") p.set("base", e.path); else p.set("sinks", e.path);
    html += `<div class="sec"><h3>🔗 Chain it ${e.kind === "source" ? "with sinks" : "after a source"}</h3>
      <div class="cmdrow" style="justify-content:flex-start;margin-top:0"><a class="btn" href="pipeline-builder.html#${p.toString()}">Open in the pipeline builder →</a></div></div>`;
  }
  const end = html.length;
  const cut = {readme: [pane.readme, pane.run], run: [pane.run, pane.repro], repro: [pane.repro, pane.chain], chain: [pane.chain, end]};
  const tabs = TABS.filter(t => cut[t[0]][1] > cut[t[0]][0]);
  const active = tabs.some(t => t[0] === state.tab) ? state.tab : "run";
  html = html.slice(0, head) + `<div class="tabs2" role="tablist">${tabs.map(t =>
      `<button type="button" class="tab2" role="tab" data-tab="${t[0]}" aria-selected="${active === t[0]}">${t[1]}</button>`).join("")}</div>` +
    tabs.map(t => `<div class="pane" data-pane="${t[0]}"${active === t[0] ? "" : " hidden"}>${html.slice(cut[t[0]][0], cut[t[0]][1])}</div>`).join("");
  $("detail").innerHTML = html;
}

// ---------------------------------------------------------------- state in the URL
function saveHash() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.area) p.set("area", state.area);
  if (state.cat) p.set("cat", state.cat);
  if (state.topics.length) p.set("topics", state.topics.join(","));
  if (state.nocreds) p.set("nocreds", "1");
  if (state.ci) p.set("ci", state.ci);
  if (state.arm) p.set("arm", "1");
  if (state.sel) p.set("ex", state.sel);
  if (state.sel && state.tab !== "run") p.set("tab", state.tab);
  if (state.env) p.set("env", state.env);
  if (state.tag) p.set("tag", state.tag);
  if (state.ctag) p.set("ctag", state.ctag);
  if (state.enable.length) p.set("enable", state.enable.join(","));
  history.replaceState(null, "", "#" + p.toString());
  // in the Examples page of the docs (an iframe): the docs page writes the selection in its own URL, to share it
  if (EMBEDDED) parent.postMessage({type: "kdp-explorer-state", hash: p.toString()}, "*");
}
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.area = AREAS.some(a => a[0] === p.get("area")) ? p.get("area") : "";
  state.q = p.get("q") || ""; state.cat = CAT[p.get("cat")] ? p.get("cat") : "";
  state.topics = (p.get("topics") || "").split(",").filter(t => TOPICS.some(x => x[0] === t));
  state.nocreds = p.get("nocreds") === "1";
  state.tab = TABS.some(t => t[0] === p.get("tab")) ? p.get("tab") : "run";
  state.ci = ["ok", "fail", "none"].includes(p.get("ci")) ? p.get("ci") : "";
  state.arm = p.get("arm") === "1"; $("armonly").checked = state.arm;
  state.sel = p.get("ex") && byPath(p.get("ex")) ? p.get("ex") : null;
  state.env = p.get("env") || ""; state.tag = p.get("tag") || ""; state.ctag = p.get("ctag") || "";
  state.enable = (p.get("enable") || "").split(",").filter(f => RUN.enable.some(x => x.flag === f));
  $("q").value = state.q; $("nocreds").checked = state.nocreds;
}
// another filter: the list starts again from its first page (embedded)
function render() { if (EMBEDDED) listLimit = LIST_PAGE; renderFilters(); renderList(); renderDetail(); saveHash(); }

// ---------------------------------------------------------------- CI status, read from the published list of examples
function loadCI() {
  fetch("content.md").then(r => r.ok ? r.text() : Promise.reject()).then(text => {
    const ci = {};
    for (const line of text.split("\n")) {
      const m = line.match(/\/tree\/master\/([a-z0-9_.\/-]+)\)/i);
      if (!m) continue;
      const dec = x => decodeURIComponent(x.replace(/%(?![0-9a-f]{2})/gi, "%25"));
      const ok = line.match(/badge\/(\d+)\/(\d+)-ok!-green\)\]\(([^)\s]+)\)/);
      const ko = line.match(/badge\/(\d+)\/(\d+)-fail!-red\)\]\(([^)\s]+)\)/);
      const cfk = line.match(/badge\/(\d+)\/(\d+)-cfk_(ok|fail)!-\w+\)\]\(([^)\s]+)\)/);
      const ver = line.match(/badge\/v-(.+?)-pink\)\]\(([^)\s]+)\)/);
      const arm = line.match(/badge\/arm64-([^)-]+)-\w+\)/);
      const owner = line.match(/badge\/-([^)]+?)-blue\)/);
      if (!ok && !ko && !cfk && !ver && !arm && !owner) continue;
      const e = {};
      if (ok || ko) { const x = ok || ko; Object.assign(e, {state: ok ? "ok" : "fail", label: x[1] + "/" + x[2] + (ok ? " passed" : " failed"), url: x[3]}); }
      if (cfk) e.cfk = {state: cfk[3], label: cfk[1] + "/" + cfk[2], url: cfk[4]};
      if (ver) { const v = dec(ver[1]).match(/^(\S+)(?:\s+\((\d{4})_(\d{2})_(\d{2})\))?/); if (v) Object.assign(e, {version: v[1], released: v[2] ? v[2] + "-" + v[3] + "-" + v[4] : "", docs: ver[2]}); }
      if (arm) { const a = dec(arm[1]); e.arm64 = /native/.test(a) ? "native" : /emulation/.test(a) ? "emulation" : /not/.test(a) ? "broken" : ""; }
      if (owner) e.owner = dec(owner[1]);
      ci[m[1]] = e;
    }
    if (Object.keys(ci).length) { CI = ci; render(); }
  }).catch(() => {});
}

// ---------------------------------------------------------------- events
function themeButton() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme").textContent = dark ? "☀️" : "🌙";
  $("theme").title = dark ? "light theme" : "dark theme";
}
$("theme").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("pg-report-theme", root.dataset.theme); } catch (e) {}
  themeButton();
};
themeButton();
$("q").oninput = e => { state.q = e.target.value; if (EMBEDDED) listLimit = LIST_PAGE; renderFilters(); renderList(); saveHash(); };
$("areas").onclick = e => { const b = e.target.closest("[data-area]"); if (!b) return; state.area = state.area === b.dataset.area ? "" : b.dataset.area; render(); };
$("cats").onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; state.cat = b.dataset.cat; render(); };
$("topics").onclick = e => { const b = e.target.closest("[data-topic]"); if (!b) return; const t = b.dataset.topic;
  state.topics = state.topics.includes(t) ? state.topics.filter(x => x !== t) : [...state.topics, t]; render(); };
$("nocreds").onchange = e => { state.nocreds = e.target.checked; render(); };
$("armonly").onchange = e => { state.arm = e.target.checked; render(); };
$("cif").onclick = e => { const b = e.target.closest("[data-ci]"); if (!b) return; state.ci = state.ci === b.dataset.ci ? "" : b.dataset.ci; render(); };
$("list").onclick = e => { if (e.target.closest("[data-more]")) { listLimit += LIST_PAGE; renderList(); return; } const it = e.target.closest(".item[data-path]"); if (!it) return; state.sel = it.dataset.path; other.ctag = false; openDD = null; readmeOpen = false; renderList(); renderDetail(); saveHash(); };
$("detail").addEventListener("input", e => {
  if (e.target.id === "o-tag" && e.target.tagName === "INPUT") state.tag = e.target.value.trim();
  else if (e.target.id === "o-ctag" && e.target.tagName === "INPUT") state.ctag = e.target.value.trim();
  else if (e.target.id === "o-desc") state.desc = e.target.value;
  else return;
  const pos = e.target.selectionStart, id = e.target.id;
  renderDetail(); saveHash();
  const el = $(id); el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {}
});
$("detail").addEventListener("change", e => {
  if (e.target.id === "o-env") state.env = e.target.value;
  else if (e.target.id === "o-tag" && e.target.tagName === "SELECT") state.tag = e.target.value;
  else if (e.target.id === "o-ctag" && e.target.tagName === "SELECT") state.ctag = e.target.value;
  else return;
  renderDetail(); saveHash();
});
$("detail").addEventListener("scroll", e => {
  if (e.target.classList && e.target.classList.contains("readme") && state.sel) readmeScroll = {dir: byPath(state.sel).dir, top: e.target.scrollTop};
}, true);
$("detail").addEventListener("click", e => {
  const btn = e.target.closest(".dd-btn");
  if (btn && !btn.disabled) {
    const key = btn.closest(".dd").dataset.dd;
    openDD = openDD === key ? null : key;
    renderDetail();
    const search = document.querySelector(".dd.open .dd-search");
    if (search) search.focus();
    const sel = document.querySelector(".dd.open .dd-item.sel");
    if (sel) sel.scrollIntoView({block: "nearest"});
    return;
  }
  const item = e.target.closest(".dd-item");
  if (item) {
    const key = item.closest(".dd").dataset.dd;
    openDD = null;
    if (item.dataset.value === OTHER) {
      other[key] = true; renderDetail();
      const el = $("o-" + key); if (el) el.focus();
      return;
    }
    state[key] = item.dataset.value; renderDetail(); saveHash(); return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    state.tab = tab.dataset.tab;
    for (const b of document.querySelectorAll("#detail [data-tab]")) b.setAttribute("aria-selected", String(b === tab));
    for (const p of document.querySelectorAll("#detail [data-pane]")) p.hidden = p.dataset.pane !== state.tab;
    saveHash();
    return;
  }
  if (e.target.closest("[data-readme]")) { readmeOpen = !readmeOpen; renderDetail(); return; }
  const back = e.target.closest("[data-back]");
  if (back) { other[back.dataset.back] = false; renderDetail(); return; }
  if (e.target.closest(".dd-panel")) return;
  const f = e.target.closest("[data-flag]");
  if (f) { const v = f.dataset.flag; state.enable = state.enable.includes(v) ? state.enable.filter(x => x !== v) : [...state.enable, v]; renderDetail(); saveHash(); return; }
  const c = e.target.closest("[data-copy]");
  if (c) navigator.clipboard.writeText(c.dataset.copy).then(() => { $("toast").classList.add("on"); setTimeout(() => $("toast").classList.remove("on"), 1600); });
});

// a dropdown: closed by a click outside or Esc, filtered as you type, Enter picks the first match
document.addEventListener("click", e => { if (openDD && !e.target.closest(".dd")) { openDD = null; renderDetail(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openDD) { openDD = null; renderDetail(); } });
$("detail").addEventListener("input", e => {
  if (!e.target.classList.contains("dd-search")) return;
  const q = e.target.value.toLowerCase().trim();
  const panel = e.target.closest(".dd-panel");
  let shown = 0;
  for (const it of panel.querySelectorAll(".dd-item")) {
    const ok = !q || it.dataset.text.includes(q);
    it.hidden = !ok; it.classList.remove("kb");
    if (ok && shown++ === 0 && q) it.classList.add("kb");
  }
  for (const g of panel.querySelectorAll(".dd-group")) g.hidden = !!q;
  panel.querySelector(".dd-empty").hidden = shown > 0;
});
$("detail").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("dd-search")) return;
  const first = e.target.closest(".dd-panel").querySelector(".dd-item.kb") || e.target.closest(".dd-panel").querySelector(".dd-item:not([hidden])");
  if (first) first.click();
});

loadHash();
render();
loadCI();
// the Examples page of the docs gives the selection of its link by changing the hash of the frame once it is loaded
// (no reload), and a link opened in the same tab does the same (saveHash uses replaceState: no hashchange, no loop)
window.addEventListener("hashchange", () => { loadHash(); render(); });
</script>
</body>
</html>
