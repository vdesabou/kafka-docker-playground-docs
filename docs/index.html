<body>
  <div id="app"></div>
  <script src="cli-pages.js"></script>
  <script>
    window.$docsify = {
      name: 'kafka-docker-playground',
      repo: 'vdesabou/kafka-docker-playground',
      coverpage: true,
      themeColor: "#d7eff6",
      homepage   : 'introduction.md',
      loadSidebar: 'sidebar.md',
      formatUpdated: "{MM}/{DD} {HH}:{mm}",

      // NAVIGATION
      // -----------------------------------------------------------------
      auto2top   : true,
      maxLevel   : 3,
      subMaxLevel: 4,

      // PLUGINS
      // -----------------------------------------------------------------
      search: {
          // 'auto' only indexes pages linked from the sidebar: also index the CLI reference pages (cli-pages.js)
          paths      : ['/introduction', '/content', '/how-to-use', '/cli', '/how-it-works', '/reusables', '/academy',
                        '/tips-and-tricks', '/legacy-java-producer', '/changelog'].concat(window.KDP_CLI_PAGES || []),
          namespace  : 'kdp',
          depth      : 3,
          noData     : 'No results!',
          placeholder: 'Search...'
      },
      'flexible-alerts': {
        style: 'callout'
      },
      executeScript: true,
      // docsify-copy-code (defaults)
      copyCode: {
        buttonText : 'Copy to clipboard',
        errorText  : 'Error',
        successText: 'Copied'
      },
      tabs: {
        persist    : true,      // default
        sync       : true,      // default
        theme      : 'classic', // default
        tabComments: true,      // default
        tabHeadings: true       // default
      },
      select: {
          detectOperatingSystem: {
            enabled: false,
            menuId: "operating-system"
          },
          sync: false,
          theme: "classic"
      },
      plugins: [
        // "Edit on github" link, except on pages generated from https://github.com/vdesabou/kafka-docker-playground
        // (CLI reference, content, introduction, changelog), where edits would be overwritten
        function (hook, vm) {
          var generated = /^(playground .*|index|cli|content|introduction|badges|changelog)\.md$/;
          hook.afterEach(function (html) {
            var file = vm.route.file && decodeURIComponent(vm.route.file);
            if (!file || generated.test(file)) {
              return html;
            }
            var url = 'https://github.com/vdesabou/kafka-docker-playground-docs/edit/main/docs/' + encodeURI(file);
            return '<div style="overflow: auto"><p style="float: right"><a style="text-decoration: underline" target="_blank" rel="noopener" href="' + url + '">Edit on github</a></p></div>' + html;
          });
        }
      ]
    }
  </script>
